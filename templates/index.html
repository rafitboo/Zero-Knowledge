{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZK // Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-5">ZK // SECURE_NETWORK</h1>
    
    <div id="statusBox" class="terminal-box mb-4 d-none">
        > Awaiting input...
    </div>

    <div class="row">
        <!-- REGISTRATION CARD -->
        <div class="col-md-6 mb-4">
            <div class="card crypto-card p-4 h-100">
                <h3 class="mb-4">INITIALIZE_USER</h3>
                <form id="registerForm">
                    {% csrf_token %}
                    <input type="text" id="regUser" class="form-control mb-3" placeholder="[USERNAME]" required>
                    <input type="email" id="regEmail" class="form-control mb-3" placeholder="[EMAIL]" required>
                    <input type="password" id="regPass" class="form-control mb-3" placeholder="[PASSWORD]" required>
                    <textarea id="regContact" class="form-control mb-4" rows="3" placeholder="[CLASSIFIED_CONTACT_INFO] -> Will be RSA Encrypted"></textarea>
                    <button type="submit" class="btn btn-cyber w-100">Register Securely</button>
                </form>
            </div>
        </div>

        <!-- LOGIN CARD -->
        <div class="col-md-6 mb-4">
            <div class="card crypto-card p-4 h-100">
                <h3 class="mb-4">AUTHENTICATE_SESSION</h3>
                <form id="loginForm">
                    {% csrf_token %}
                    <input type="text" id="loginUser" class="form-control mb-3" placeholder="[USERNAME]" required>
                    <input type="password" id="loginPass" class="form-control mb-3" placeholder="[PASSWORD]" required>
                    <button type="submit" class="btn btn-cyber-alt w-100">Request Access</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 2FA POPUP MODAL -->
<div class="modal fade" id="otpModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content crypto-card">
      <div class="modal-header border-bottom border-secondary">
        <h5 class="modal-title text-warning fw-bold">2FA // IDENTITY VERIFICATION</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
       <p class="text-warning small">A secure transmission containing your One-Time Password has been dispatched to your email.</p>
        <form id="modalOtpForm">
            <input type="text" id="modalOtpCode" class="form-control mb-4 text-center fs-4" placeholder="••••••" required autocomplete="off">
            <button type="submit" class="btn btn-outline-warning w-100" style="font-family: monospace; font-weight: bold; letter-spacing: 1px;">VERIFY CODE</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Add Bootstrap JS for the modal functionality -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
